name: Release

# 推送 v* 标签时自动构建 Windows(NSIS) + Linux(AppImage/deb) 并创建 Release
# （按需求不构建 macOS）
# 前置条件：在仓库 Settings → Secrets and variables → Actions 配置：
#   TAURI_SIGNING_PRIVATE_KEY          = C:\Users\Firs\.tauri\uartix-plus.key 的文件内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 留空即可（该密钥无密码）

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      # 固定 tag/版本号（供后续步骤复用）
      - name: Resolve version
        id: ver
        shell: bash
        run: echo "tag=v$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      # 草稿 Release 用仓库内 note 文件驱动（每次发版改 docs/RELEASE_NOTES/vX.Y.Z.md）
      # tauri-action 发现同 tag Release 已存在时会直接复用上传资产，不会覆盖 note
      - name: Create draft release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --draft \
            --title "Uartix+ ${{ steps.ver.outputs.tag }}" \
            --notes-file "docs/RELEASE_NOTES/${{ steps.ver.outputs.tag }}.md" || true

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Uartix+ v__VERSION__"
          releaseBody: "见 docs/RELEASE_NOTES。"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # 固定文件名副本 → releases/latest/download/<固定名> 成为永久下载地址
      # （官网/外链一次配置，发新版后自动指向最新，无需再改）
      - name: Upload stable-named assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          VER="${TAG#v}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC="src-tauri/target/release/bundle/nsis/Uartix-Plus_${VER}_x64-setup.exe"
            cp "$SRC" "Uartix-Plus-windows-x64-Setup.exe"
            gh release upload "$TAG" "Uartix-Plus-windows-x64-Setup.exe" --clobber
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage "Uartix-Plus-linux-x64.AppImage"
            cp src-tauri/target/release/bundle/deb/*.deb "Uartix-Plus-linux-x64.deb"
            gh release upload "$TAG" "Uartix-Plus-linux-x64.AppImage" "Uartix-Plus-linux-x64.deb" --clobber
          fi
