name: Release

# 推送 v* 标签时自动构建 Windows(NSIS) + Linux(AppImage/deb) 并创建 Release
# （按需求不构建 macOS）
# 前置条件：在仓库 Settings → Secrets and variables → Actions 配置：
#   TAURI_SIGNING_PRIVATE_KEY          = C:\Users\Firs\.tauri\uartix-plus.key 的文件内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 留空即可（该密钥无密码）

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 前置单例 job：先建草稿 Release（读 note 文件）。
  # 修竞态：此前两个 matrix job 并行各自建同 tag 草稿，GitHub 允许同 tag 存在
  # 多个草稿 → tauri-action 按 tag 找草稿时资产分裂到两个 release，Publish 其一
  # 后另一份资产（Linux/固定名副本）永远缺失。现在只有本 job 创建，build 复用。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "tag=v$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Create draft release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 已存在（重发/补资产场景）则复用：tauri-action 与固定名上传都按 tag 定位
          gh release create "${{ steps.ver.outputs.tag }}" \
            --draft \
            --title "Uartix+ ${{ steps.ver.outputs.tag }}" \
            --notes-file "docs/RELEASE_NOTES/${{ steps.ver.outputs.tag }}.md" \
            || echo "::warning::release ${{ steps.ver.outputs.tag }} already exists, reusing it"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Uartix+ v__VERSION__"
          releaseBody: "见 docs/RELEASE_NOTES。"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # 固定文件名副本 → releases/latest/download/<固定名> 成为永久下载地址
      # （官网/外链一次配置，发新版后自动指向最新，无需再改）
      - name: Upload stable-named assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          VER="${TAG#v}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC="src-tauri/target/release/bundle/nsis/Uartix-Plus_${VER}_x64-setup.exe"
            cp "$SRC" "Uartix-Plus-windows-x64-Setup.exe"
            gh release upload "$TAG" "Uartix-Plus-windows-x64-Setup.exe" --clobber
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage "Uartix-Plus-linux-x64.AppImage"
            cp src-tauri/target/release/bundle/deb/*.deb "Uartix-Plus-linux-x64.deb"
            gh release upload "$TAG" "Uartix-Plus-linux-x64.AppImage" "Uartix-Plus-linux-x64.deb" --clobber
          fi
