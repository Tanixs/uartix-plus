server {
    listen 80;
    listen [::]:80;
    server_name larix.teuioe.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name larix.teuioe.cn;
    root /usr/share/nginx/html;

    ssl_certificate /etc/letsencrypt/live/larix.teuioe.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/larix.teuioe.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uartix+ AI BUG 巡检上报（PHP-FPM）
    location ^~ /api/ {
        root /var/www/uartix;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uartix+ 安装包与更新清单下载（/dl/v0.2.0/...）
    location ^~ /dl/ {
        alias /var/www/uartix/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:8880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uartix-plus/ {
        proxy_pass http://127.0.0.1:8880/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /uartix-plus/;
        sub_filter 'href="/' 'href="/uartix-plus/';
        sub_filter 'src="/' 'src="/uartix-plus/';
        sub_filter 'NEXT_REDIRECT;replace;/en;' 'NEXT_REDIRECT;replace;/uartix-plus/en;';
        sub_filter_once off;
    }

    location = /en {
        return 302 /uartix-plus/en;
    }

    location = /zh {
        return 302 /uartix-plus/zh;
    }

    location ^~ /en/ {
        proxy_pass http://127.0.0.1:8880/en/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /zh/ {
        proxy_pass http://127.0.0.1:8880/zh/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /icon.svg {
        proxy_pass http://127.0.0.1:8880/icon.svg;
        proxy_set_header Host $host;
    }
}
