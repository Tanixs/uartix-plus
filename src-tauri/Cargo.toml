[package]
name = "uartix-plus"
version = "0.5.0"
description = "Uartix+ - visual serial protocol analyzer"
authors = ["Tanix"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uartix_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 下限钉到 2.11 **这一条线**（`~`＝>=2.11 <2.12）：npm 侧 `@tauri-apps/plugin-updater` 也锁在同一线，
# 两边不一致时 tauri CLI 每次启动都报 `Error Found version mismatched`（P90 起挂账，P99c-M 结掉）。
# 为什么不用 `"2.11"`：caret 语义会放行 2.12（本次实测真的解析成了 2.12.0），漂移只是换了个方向。
tauri-plugin-updater = "~2.11"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serialport = "4"
btleplug = "0.11"
uuid = "1"
tokio = { version = "1", features = ["time", "sync"] }
if-addrs = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
futures-util = "0.3"
rust_xlsxwriter = { version = "0.99.0", features = ["zlib"] }

